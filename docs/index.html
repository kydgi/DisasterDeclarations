<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Declarations Summaries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Prompt', sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
    }

    #content {
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        color: #333;
    }

    h2 {
        color: #555;
    }

    ul {
        list-style-type: none;
        padding-left: 0;
    }

    li {
        background-color: #e9e9e9;
        margin: 5px 0;
        padding: 10px;
        border-radius: 5px;
    }
</style>
</head>

<body>
    <div id="content">
        <h1>Disaster Declarations Summaries</h1>
        <p></p>
    </div>
    <script>
        let femaApi = "https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries"
        femaApi += "?$filter=state eq 'KY'&$orderby=declarationDate desc&$top=1000000&$format=json";
        let earliest = "2027-01-01T00:00:00Z";
        let latest = "1900-01-01T00:00:00Z";
        async function fetchData() {
            try {
                const response = await fetch(femaApi);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }
        async function getKyData() {
            const data = await fetchData();
            counties = {};
            for (const e of data.DisasterDeclarationsSummaries) {
                if (e.state == "KY") {
                    const attributes = [
                        e.incidentBeginDate,
                        e.fipsCountyCode,
                        e.incidentType,
                        e.declarationTitle,
                        e.designatedArea,
                        e.state,
                    ];
                    if (counties[e.fipsCountyCode] == undefined) {
                        counties[e.fipsCountyCode] = [attributes];
                    } else {
                        counties[e.fipsCountyCode].push(attributes);
                    }
                }
            }
            // console.log(counties);
            return counties;
        }
        async function displayData() {
            const counties = await getKyData();
            const contentDiv = document.getElementById('content');
            Object.entries(counties)
                .sort(([a], [b]) => Number(a) - Number(b))
                .forEach(([key, county]) => {
                    statistics = {}
                    // console.log(key, county);
                    const countyData = county;
                    const countyDiv = document.createElement('div');
                    countyDiv.innerHTML = `<h2>${countyData[0][4]}: ${countyData.length} incidents</h2>`;
                    const list = document.createElement('ul');
                    for (const attributes of countyData) {
                        statistics[attributes[2]] = (statistics[attributes[2]] || 0) + 1;
                        if (attributes[0] < earliest) {
                            earliest = attributes[0];
                        }
                        if (attributes[0] > latest) {
                            latest = attributes[0];
                        }
                    }
                    for (const [incidentType, count] of Object.entries(statistics)) {
                        const listItem = document.createElement('li');
                        listItem.textContent = `${incidentType}: ${count}`;
                        list.appendChild(listItem);
                    }
                    countyDiv.appendChild(list);
                    contentDiv.appendChild(countyDiv);
                });
            document.querySelector('p').innerHTML += `Earliest incident: ${earliest.split("T")[0]} | `;
            document.querySelector('p').innerHTML += `Latest incident: ${latest.split("T")[0]}`;
        }
        displayData();

    </script>
</body>

</html>
